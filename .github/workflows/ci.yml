name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build container image
        run: docker build --tag devopslab:ci .
      - name: Start Compose services
        run: docker compose up --build --detach
        env:
          APP_PORT: 3001
          DB_PORT: 5433
      - name: Wait for API health
        run: |
          for attempt in {1..30}; do
            curl --fail --silent http://localhost:3001/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgres://devopslab:devopslab@localhost:5433/devopslab
      - name: Stop Compose services
        if: always()
        run: docker compose down --volumes
